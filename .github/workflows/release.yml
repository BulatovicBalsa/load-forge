name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            archive_name: loadforge-linux-x64.zip
          - os: macos-13
            platform: darwin-x64
            archive_name: loadforge-darwin-x64.zip
          - os: macos-latest
            platform: darwin-arm64
            archive_name: loadforge-darwin-arm64.zip
          - os: windows-latest
            platform: windows-x64
            archive_name: loadforge-windows-x64.zip

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync

      - name: Build onedir bundle
        run: uv run pyinstaller loadforge.spec --noconfirm

      - name: Create zip archive (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd dist
          zip -r "${{ matrix.archive_name }}" loadforge

      - name: Create zip archive (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/loadforge -DestinationPath "dist/${{ matrix.archive_name }}"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive_name }}
          path: dist/${{ matrix.archive_name }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate update manifest
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          artifacts_dir = Path("artifacts")
          tag = os.environ["GITHUB_REF_NAME"]
          version = tag[1:] if tag.startswith("v") else tag
          base_url = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{tag}"

          assets = {}
          for archive in sorted(artifacts_dir.glob("loadforge-*.zip")):
              platform = archive.name.removeprefix("loadforge-").removesuffix(".zip")
              sha256 = hashlib.sha256(archive.read_bytes()).hexdigest()
              assets[platform] = {
                  "file": archive.name,
                  "url": f"{base_url}/{archive.name}",
                  "sha256": sha256,
              }

          manifest = {
              "version": version,
              "tag": tag,
              "assets": assets,
          }

          output = artifacts_dir / "update-manifest.json"
          output.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*.zip
            artifacts/update-manifest.json
