name: CI

on:
  pull_request:
  push:
    tags-ignore:
      - "v*"

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --dev

      - name: Run tests
        run: uv run pytest -q

      - name: Build onedir bundle
        run: uv run pyinstaller loadforge-onedir.spec --noconfirm

      - name: Verify onedir output
        run: test -d dist/loadforge

      - name: Build onefile fallback
        run: uv run pyinstaller loadforge-onefile.spec --noconfirm

      - name: Verify onefile output
        run: test -f dist/loadforge-fallback

      - name: Upload onefile artifact
        uses: actions/upload-artifact@v4
        with:
          name: loadforge-fallback-linux-x64
          path: dist/loadforge-fallback
          if-no-files-found: error
